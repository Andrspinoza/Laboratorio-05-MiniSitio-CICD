name: CI del mini sitio

on:
  push:
    branches: [main, "feature/**", "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar-sitio:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar archivos esenciales
        run: node scripts/verify-site.mjs
